name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install package
        run: python -m pip install .
      - name: Check CLI
        run: python -m redstone_music doctor
      - name: Test contracts and original demo integration
        run: python -m unittest discover -s tests -v
