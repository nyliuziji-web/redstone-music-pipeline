[build-system]
requires = ["setuptools>=77,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redstone-music-pipeline"
version = "0.4.0a1"
description = "Agent-neutral redstone music production kit with professional skills, tools and version-bound evidence"
readme = "PIPELINE.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "Redstone Music Pipeline contributors"}]
dependencies = ["nbtlib>=2.0.4,<3", "numpy>=2.0,<3", "jsonschema>=4.23,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.optional-dependencies]
production = ["mido>=1.3,<2", "music21>=9,<12", "soundfile>=0.13,<0.15", "scipy>=1.15,<2", "librosa>=0.11,<0.12", "Pillow>=11,<13"]
render-tiny = ["tinysoundfont>=0.3.7,<0.4"]
pitch = ["swift-f0[audio,midi]>=0.3,<0.4"]
dev = ["build>=1.2,<2", "wheel"]

[project.scripts]
redstone-music = "redstone_music.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["redstone_music*"]
exclude = ["tests*", "projects*", "nevada*"]

[tool.setuptools.package-data]
redstone_music = ["assets/*.mjs", "assets/*.json", "assets/*.java", "kit_data/**/*", "_vendor/**/*.txt", "_vendor/**/LICENSE*", "_vendor/**/*.json"]
